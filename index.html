<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Control Panel</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at center, #0a0a0f 0%, #000 100%);
    color: #00fff0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #00fff0;
    text-shadow: 0 0 10px #00fff0, 0 0 20px #00fff0;
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }
  .hamburger div {
    width: 30px;
    height: 3px;
    background: #00fff0;
    border-radius: 2px;
    box-shadow: 0 0 8px #00fff0;
  }

  main {
    flex: 1;
    padding: 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
    perspective: 1000px;
  }

  .panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    border: 2px solid rgba(0,255,255,0.6);
    border-radius: 12px;
    background: rgba(0,255,255,0.05);
    color: #00fff0;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,255,255,0.2);
    transform-style: preserve-3d;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .panel:hover {
    transform: rotateY(10deg) rotateX(5deg);
    box-shadow: 0 0 40px #00fff0, 0 0 60px #00fff0;
  }

  .panel h2 {
    margin: 0 0 1rem 0;
    text-shadow: 0 0 5px #00fff0;
  }

  .halfmoon-field {
    width: 80%;
    height: 50px;
    background: rgba(0,255,255,0.1);
    border: 2px solid rgba(0,255,255,0.6);
    border-radius: 25px 25px 0 0;
    color: #00fff0;
    text-align: center;
    font-size: 1rem;
    outline: none;
    box-shadow: 0 0 10px #00fff0;
  }

  .flat-barometer {
    width: 80%;
    height: 15px;
    background: rgba(0,255,255,0.1);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 1rem;
    box-shadow: inset 0 0 10px #00fff0;
  }
  .flat-barometer-fill {
    height: 100%;
    background: linear-gradient(90deg, #00fff0, #00ffff);
    width: 75%;
  }

  footer {
    text-align: center;
    padding: 1rem;
  }
  footer .banner {
    background: rgba(0,255,255,0.2);
    padding: 0.5rem;
    border-radius: 12px;
    font-weight: bold;
    color: #00fff0;
    margin-top: 0.5rem;
    display: inline-block;
    box-shadow: 0 0 10px #00fff0;
  }

</style>
</head>
<body>
<header>
  <h1>Holo Control Panel</h1>
  <div class="hamburger" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>
</header>

<main>
  <div class="panel">
    <h2>Search</h2>
    <input class="halfmoon-field" placeholder="Enter query...">
  </div>

  <div class="panel">
    <h2>Conclusion</h2>
    <p>System insights displayed here.</p>
  </div>

  <div class="panel">
    <h2>Graph</h2>
    <canvas id="graphCanvas" width="200" height="150"></canvas>
  </div>

  <div class="panel">
    <h2>Barometer</h2>
    <div class="flat-barometer">
      <div class="flat-barometer-fill"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Engine Status</h2>
    <p>Nominal</p>
  </div>

  <div class="panel">
    <h2>Fuel Level</h2>
    <div class="flat-barometer">
      <div class="flat-barometer-fill" style="width:68%;"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Navigation</h2>
    <p>12.34°N, 56.78°E</p>
  </div>

  <div class="panel">
    <h2>Alerts</h2>
    <p>No alerts</p>
  </div>
</main>

<footer>
  &copy; 2026 Holographic Panel
  <div class="banner">Neon Holo Cockpit</div>
</footer>

<script>
function toggleMenu(){ alert('Hamburger clicked!'); }

// Chart.js for graph
const script = document.createElement('script');
script.src = "https://cdn.jsdelivr.net/npm/chart.js";
script.onload = () => {
  const ctx = document.getElementById('graphCanvas').getContext('2d');
  new Chart(ctx, {
    type:'line',
    data:{
      labels:['Jan','Feb','Mar','Apr','May','Jun'],
      datasets:[{label:'Data', data:[12,19,3,5,2,3], borderColor:'#00fff0', backgroundColor:'#00fff033', tension:0.3}]
    },
    options:{
      plugins:{legend:{labels:{color:'#00fff0'}}},
      scales:{
        x:{ticks:{color:'#00fff0'},grid:{color:'#00fff050'}},
        y:{ticks:{color:'#00fff0'},grid:{color:'#00fff050'}}
      }
    }
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
