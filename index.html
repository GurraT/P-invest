<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Metallic Control Panel</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    background: rgba(30,30,50,0.5);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { margin:0; font-size:1.8rem; color:#00fff0; }
  .hamburger { display:flex; flex-direction:column; cursor:pointer; gap:5px; }
  .hamburger div { width:30px; height:3px; background:#00fff0; border-radius:2px; }

  main {
    flex:1;
    padding:2rem;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    grid-auto-rows: 180px;
    gap:1.5rem;
  }

  .panel {
    background: rgba(50,50,60,0.3);
    border-radius: 16px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:1rem;
    transition: transform 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(8px) saturate(150%);
    border: 1px solid rgba(200,200,200,0.2);
    background-image: linear-gradient(
      145deg,
      rgba(180,180,180,0.1) 0%,
      rgba(255,255,255,0.05) 50%,
      rgba(180,180,180,0.1) 100%
    );
  }
  .panel:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px #00fff080;
  }

  .panel h2 { color:#00fff0; margin:0 0 1rem 0; }

  /* Half-moon shaped search and input fields */
  .halfmoon-field {
    width: 80%;
    height: 50px;
    background: rgba(255,255,255,0.05);
    border: none;
    border-radius: 25px 25px 0 0; /* half-moon top */
    color:#00fff0;
    text-align:center;
    font-size:1rem;
    outline:none;
  }

  /* Flat horizontal barometer */
  .flat-barometer {
    width: 80%;
    height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 1rem;
  }
  .flat-barometer-fill {
    height: 100%;
    background: linear-gradient(90deg,#00fff0,#00ffff);
    width: 75%; /* current value */
  }

  footer {
    text-align:center;
    padding:1rem;
    background: rgba(30,30,50,0.5);
    backdrop-filter: blur(10px);
  }
  footer .banner {
    background: linear-gradient(90deg, #00fff0, #ff00ff);
    padding:0.5rem;
    border-radius:12px;
    font-weight:bold;
    color:#000;
    margin-top:0.5rem;
    display:inline-block;
  }
</style>
</head>
<body>
<header>
  <h1>Metallic Control Panel</h1>
  <div class="hamburger" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>
</header>

<main>
  <div class="panel">
    <h2>Search</h2>
    <input class="halfmoon-field" placeholder="Enter query...">
  </div>

  <div class="panel">
    <h2>Conclusion</h2>
    <p style="text-align:center;">System insights displayed here.</p>
  </div>

  <div class="panel">
    <h2>Graph</h2>
    <canvas id="graphCanvas" width="200" height="150"></canvas>
  </div>

  <div class="panel">
    <h2>Barometer</h2>
    <div class="flat-barometer">
      <div class="flat-barometer-fill"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Engine Status</h2>
    <p>Nominal</p>
  </div>

  <div class="panel">
    <h2>Fuel Level</h2>
    <div class="flat-barometer">
      <div class="flat-barometer-fill" style="width:68%;"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Navigation</h2>
    <p>12.34°N, 56.78°E</p>
  </div>

  <div class="panel">
    <h2>Alerts</h2>
    <p>No alerts</p>
  </div>
</main>

<footer>
  &copy; 2026 Metallic Panel
  <div class="banner">Neon Cockpit Active</div>
</footer>

<script>
function toggleMenu(){ alert('Hamburger clicked!'); }

// Chart example
const script = document.createElement('script');
script.src = "https://cdn.jsdelivr.net/npm/chart.js";
script.onload = () => {
  const ctx = document.getElementById('graphCanvas').getContext('2d');
  new Chart(ctx, {
    type:'line',
    data:{
      labels:['Jan','Feb','Mar','Apr','May','Jun'],
      datasets:[{label:'Data', data:[12,19,3,5,2,3], borderColor:'#00fff0', backgroundColor:'#00fff033', tension:0.3}]
    },
    options:{
      plugins:{legend:{labels:{color:'#00fff0'}}},
      scales:{
        x:{ticks:{color:'#00fff0'},grid:{color:'#00fff050'}},
        y:{ticks:{color:'#00fff0'},grid:{color:'#00fff050'}}
      }
    }
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
