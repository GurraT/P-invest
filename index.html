<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic HUB UI</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="header">
    <h1 class="site-title">Futuristic HUB UI</h1>
    <div class="top-nav">
        <div class="hex small" data-name="Dashboard"></div>
        <div class="hex small" data-name="Systems"></div>
        <div class="hex small" data-name="Network"></div>
        <div class="hex small" data-name="Security"></div>
        <div class="hex small" data-name="Settings"></div>
    </div>
</header>

<!-- HUB -->
<div class="hub-container">
    <div class="hub" id="hubDisplay">HUB</div>

    <div class="orbit">
        <div class="node" data-name="Home"></div>
        <div class="node" data-name="Light"></div>
        <div class="node" data-name="Camera"></div>
        <div class="node" data-name="Data"></div>
        <div class="node" data-name="Stats"></div>
        <div class="node" data-name="Grid"></div>
        <div class="node" data-name="Lock"></div>
        <div class="node" data-name="Settings"></div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
