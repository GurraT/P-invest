<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Metallic Dashboard</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(120deg, rgba(255,255,255,0.02), rgba(200,200,200,0.05));
    color: #c0c0c0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    perspective: 1200px;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #c0c0c0;
    text-shadow: 0 0 4px rgba(255,255,255,0.4);
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }
  .hamburger div {
    width: 30px;
    height: 3px;
    background: rgba(200,200,200,0.6);
    border-radius: 2px;
    box-shadow: 0 0 4px rgba(255,255,255,0.3);
  }

  main {
    flex: 1;
    padding: 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
  }

  .panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    border: none; /* removed border */
    border-radius: 16px;
    background: rgba(255,255,255,0.03);
    color: #c0c0c0;
    text-align: center;
    box-shadow: 0 0 12px rgba(255,255,255,0.1);
    transform-style: preserve-3d;
    transition: transform 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(6px) saturate(150%);
  }

  .panel:hover {
    transform: translateZ(20px) rotateY(5deg) rotateX(3deg);
    box-shadow: 0 0 24px rgba(255,255,255,0.2);
  }

  .panel h2 {
    margin: 0 0 1rem 0;
    font-weight: 500;
    text-shadow: 0 0 2px rgba(255,255,255,0.3);
  }

  .flat-barometer {
    width: 80%;
    height: 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 1rem;
    box-shadow: inset 0 0 6px rgba(255,255,255,0.2);
  }
  .flat-barometer-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(200,200,200,0.4), rgba(255,255,255,0.2));
    width: 75%;
  }

  footer {
    text-align: center;
    padding: 1rem;
  }
  footer .banner {
    background: rgba(255,255,255,0.05);
    padding: 0.5rem 1rem;
    border-radius: 12px;
    font-weight: bold;
    color: #c0c0c0;
    margin-top: 0.5rem;
    display: inline-block;
    box-shadow: 0 0 6px rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
<header>
  <h1>Holographic Metallic Panel</h1>
  <div class="hamburger" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>
</header>

<main>
  <!-- Conclusion Panel on top -->
  <div class="panel">
    <h2>Conclusion</h2>
    <p>System insights displayed here.</p>
  </div>

  <!-- Graph Panel -->
  <div class="panel">
    <h2>Graph</h2>
    <canvas id="graphCanvas" width="200" height="150"></canvas>
  </div>

  <!-- Barometer Panel -->
  <div class="panel">
    <h2>Barometer</h2>
    <div class="flat-barometer">
      <div class="flat-barometer-fill"></div>
    </div>
  </div>
</main>

<footer>
  &copy; 2026 Metallic Hologram
  <div class="banner">Floating Holographic Dashboard</div>
</footer>

<script>
function toggleMenu(){ alert('Hamburger clicked!'); }

// Chart.js for graph
const script = document.createElement('script');
script.src = "https://cdn.jsdelivr.net/npm/chart.js";
script.onload = () => {
  const ctx = document.getElementById('graphCanvas').getContext('2d');
  new Chart(ctx, {
    type:'line',
    data:{
      labels:['Jan','Feb','Mar','Apr','May','Jun'],
      datasets:[{
        label:'Data', 
        data:[12,19,3,5,2,3], 
        borderColor:'rgba(200,200,200,0.6)', 
        backgroundColor:'rgba(255,255,255,0.1)', 
        tension:0.3
      }]
    },
    options:{
      plugins:{legend:{labels:{color:'#c0c0c0'}}},
      scales:{
        x:{ticks:{color:'#c0c0c0'},grid:{color:'rgba(200,200,200,0.1)'}},
        y:{ticks:{color:'#c0c0c0'},grid:{color:'rgba(200,200,200,0.1)'}}
      }
    }
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
